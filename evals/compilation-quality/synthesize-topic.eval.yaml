# Synthesize-pass quality eval (E10-B02).
#
# Scores a compiled topic page — the cross-source synthesis output —
# against five rubric criteria. The golden-corpus runner retargets this
# spec to a real topic page after compilation; the checked-in path is the
# deterministic default produced from tests/fixtures/populated.
#
# Run with: ico eval run --spec evals/compilation-quality/synthesize-topic.eval.yaml
id: compile-synthesize-topic-001
name: Synthesize quality — golden corpus topic page
description: |
  Verifies the synthesize pass produced a cross-source topic page with
  traceable coverage, meaningful themes, and honest treatment of uncertainty.
type: compilation
pass: synthesize
target_page: topics/knowledge-compilation-as-a-category-defining-operation.md
threshold: 0.8
criteria:
  - id: coverage
    description: |
      The page identifies multiple contributing sources in frontmatter and
      integrates their relevant claims without silently dropping a source.
  - id: cross-source-synthesis
    description: |
      The page identifies meaningful themes that cut across sources rather
      than merely concatenating one summary after another.
  - id: uncertainty-honesty
    description: |
      Where the sources disagree or leave questions open, the page names
      that uncertainty; when no disagreement is present, it does not invent one.
  - id: no-redundancy
    description: |
      Each section adds new information. The page does not repeat a source
      summary wholesale or pad the synthesis with redundant prose.
  - id: schema-conformance
    description: |
      Frontmatter includes title, type=topic, summary, compiled_at, model,
      source_ids, and concept_ids; the body is structured readable Markdown.
