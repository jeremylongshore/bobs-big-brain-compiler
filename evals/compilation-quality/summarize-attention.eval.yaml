# Summarize-pass quality eval (E10-B02).
#
# Scores a source summary against five rubric criteria. The golden-corpus
# runner retargets this spec to a real page after compilation; the checked-in
# path is the deterministic default produced from tests/fixtures/populated.
#
# Run with: ico eval run --spec evals/compilation-quality/summarize-attention.eval.yaml
id: compile-summarize-attention-001
name: Summarize quality — golden corpus source page
description: |
  Verifies the summarize pass extracted the key claims of a golden-corpus
  source without inventing facts, preserved provenance, and stayed concise.
type: compilation
pass: summarize
target_page: sources/sample-article.md
threshold: 0.8 # pass when normalized score >= 0.8 (mean criterion >= 4.0)
criteria:
  - id: completeness
    description: |
      Captures the source's major claims and conclusions. Missing a core
      thesis = 1; missing a supporting point = 3; complete = 5.
  - id: accuracy
    description: |
      The summary is faithful to the source and does not invent facts,
      metrics, authors, or methods. A distorted paraphrase = 3; fabrication = 1.
  - id: structure
    description: |
      Honors the source-summary schema: title, type=source-summary,
      source_path, and Summary, Key Claims, Methods, and Conclusions sections.
  - id: provenance
    description: |
      Frontmatter preserves provenance sufficient to trace the page back to
      its raw source, including source_id, source_path, and content_hash.
  - id: concision
    description: |
      No material filler or unsupported digressions. The page is a useful
      compact representation rather than a near-verbatim copy of the source.
