name: Mutation Testing

# L3 mutation-survival measurement via Stryker. Targets kernel
# (highest-value module) per stryker.config.json.
#
# Triggers (post-baseline lock 2026-05-25, bead 0wy.1):
#   - pull_request: `mutation-test` gates the operational merge path
#     when present. stryker.config.json `thresholds.break` defines
#     the floor; PRs that drop the kill rate below the floor fail
#     this job. Floor is `(baseline - 5)` per the tolerance band
#     defined in tests/TESTING.md.
#   - workflow_dispatch / schedule: on-demand + nightly for trend data.
#
# Scope (kernel-only, not compiler) is intentional for v1: kernel has
# the deterministic-state-machine surface where mutation testing has
# the highest signal-to-noise. The compiler talks to Claude through a
# mockable interface (ClaudeClient) but a meaningful mutation score
# there would need a coverage-of-mocked-paths story we don't have yet.
# Compiler scope is the natural successor bead.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Nightly at 04:00 UTC for trend data.
    - cron: '0 4 * * *'

permissions:
  contents: read

# Supersede validation only for the same PR. Keep main, scheduled, and manual
# runs independent; this policy must never be copied onto deployment workflows.
concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation-test:
    # Keep this name stable for the operational merge guard, which requires
    # observed non-advisory checks. GitHub protection has a separate check list.
    name: mutation-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Stryker run
        run: pnpm mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
